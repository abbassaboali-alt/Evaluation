<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function () {
        "use strict";
        const ALLOWED_HOSTS = new Set([
          "www.prudle-education.com",
          "prudle-education.com",
          "abbassaboali-alt.github.io"
        ]);
        const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
        window.addEventListener("keydown", function(event) {
          if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "s") {
            event.preventDefault();
          }
        }, { capture: true });

        const host = location.hostname.toLowerCase();
        const isDevOrPreview = host === "localhost" || host === "127.0.0.1" || host.endsWith(".run.app") || host.endsWith(".local") || location.protocol === "http:";
        if (!isDevOrPreview) {
          const approved = location.protocol === "https:" && ALLOWED_HOSTS.has(host);
          if (!approved) {
            window.stop();
            try { document.documentElement.innerHTML = ""; } catch (_) {}
            location.replace(LOGIN_URL);
          }
        }
      })();
    </script>
